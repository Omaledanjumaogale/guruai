<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#050505" />
	<meta name="robots" content="noindex" />
	<title>That page is not here · Guru AI</title>
	<style>
		:root { color-scheme: dark; --bg:#050505; --panel:#0d0d0f; --line:#26262b; --ink:#f4f4f5; --muted:#a1a1aa; --brand:#818cf8; --cyan:#22d3ee; }
		* { box-sizing: border-box; }
		body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(900px 480px at 80% -10%, rgba(99,102,241,.18), transparent 60%), radial-gradient(700px 420px at 0% 110%, rgba(34,211,238,.12), transparent 55%), var(--bg); color:var(--ink); font-family:"Inter","Segoe UI",system-ui,sans-serif; }
		main { width:100%; max-width:620px; background:linear-gradient(180deg, rgba(24,24,27,.9), rgba(9,9,11,.92)); border:1px solid var(--line); border-radius:20px; padding:32px; box-shadow:0 24px 80px rgba(0,0,0,.55); }
		.brand { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
		.mark { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:700; background:linear-gradient(135deg,#4f46e5,#06b6d4); }
		.brand p { margin:0; font-weight:700; letter-spacing:.02em; }
		.brand small { color:var(--muted); letter-spacing:.18em; text-transform:uppercase; font-size:10px; }
		.code { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--brand); margin:0 0 8px; }
		h1 { font-size:clamp(1.4rem, 3vw, 1.9rem); line-height:1.2; margin:0 0 12px; }
		p { color:var(--muted); line-height:1.65; margin:0 0 20px; }
		a.btn { display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:11px; text-decoration:none; font-weight:600; font-size:14px; }
		.primary { background:linear-gradient(135deg,#4f46e5,#6366f1); color:#fff; }
		.ghost { border:1px solid var(--line); color:var(--ink); background:rgba(39,39,42,.4); }
		.actions { display:flex; flex-wrap:wrap; gap:10px; }
		nav { display:flex; flex-wrap:wrap; gap:14px; margin-top:24px; padding-top:18px; border-top:1px solid var(--line); font-size:13px; }
		nav a { color:var(--muted); text-decoration:none; }
		nav a:hover { color:var(--ink); }
		:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
	</style>
</head>
<body>
	<main id="main">
		<div class="brand">
			<div class="mark">G</div>
			<div><p>Guru AI</p><small>Enterprise workspace</small></div>
		</div>
		<p class="code">Error 404</p>
		<h1>That page is not here</h1>
		<p>The address may be mistyped, or the page may have moved. Your workspace and every module are still one click away — nothing was lost.</p>
		<div class="actions"><a class="btn primary" href="/home">Open the workspace</a><a class="btn ghost" href="/">Product overview</a></div>
		<nav aria-label="Recovery links">
			<a href="/home">Workspace</a>
			<a href="/">Product overview</a>
			<a href="/chat">Chat</a>
			<a href="/login">Sign in</a>
			<a href="/settings">Settings</a>
		</nav>
	</main>
</body>
</html>
