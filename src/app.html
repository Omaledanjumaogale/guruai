<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			try {
				const saved = localStorage.getItem("guru.theme");
				document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
			} catch {}
		</script>
		<meta name="theme-color" content="#060607" />
		<meta name="description" content="Guru AI — one enterprise workspace for chat, imagery, video, music, diagrams, research, transcripts, converters, notes and AI agents. Role-based access, private support messaging and an audit trail built in." />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Guru AI" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta property="og:title" content="Guru AI — Enterprise AI Workspace" />
		<meta property="og:description" content="Chat, studios, humanizer, keyword intelligence, converters, transcripts, notes, agents and a Reverse API Lab in one harmonized workspace." />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="%sveltekit.assets%/images/generated/promo-slide-01.webp" />
		<meta property="og:image:width" content="1536" />
		<meta property="og:image:height" content="864" />
		<meta property="og:image:alt" content="Guru AI workspace artwork" />
		<meta property="og:site_name" content="Guru AI" />
		<meta name="twitter:card" content="summary_large_image" />
		<title>Guru AI — Enterprise AI Workspace</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<a class="skip-link" href="#main">Skip to content</a>
		<div style="display: contents">%sveltekit.body%</div>
		<noscript>
			<p style="font-family: system-ui, sans-serif; color: #f6f5f1; padding: 24px">
				Guru AI needs JavaScript enabled. Please turn it on and reload the app.
			</p>
		</noscript>
	</body>
</html>
